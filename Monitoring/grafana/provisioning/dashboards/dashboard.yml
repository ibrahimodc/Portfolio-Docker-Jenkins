# ═══════════════════════════════════════════════════════════════════════════════
#  Grafana — Dashboard Provider (provisioning automatique)
#  Charge automatiquement les dashboards JSON places dans /var/lib/grafana/dashboards
# ═══════════════════════════════════════════════════════════════════════════════

apiVersion: 1

providers:
  - name: "Portfolio Dashboards"
    orgId: 1
    folder: "Portfolio"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards