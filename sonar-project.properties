# ============================================
# sonar-project.properties
# ============================================

# Identification du projet
sonar.projectKey=jenkins-portfolio
sonar.projectName=Jenkins Portfolio
sonar.projectVersion=1.0

# Sources à analyser
# ⚠️ Vérifie que ces dossiers existent bien
sonar.sources=frontend,backend

# Fichiers à exclure
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/public/**,**/.git/**,**/uploads/**

# Encodage
sonar.sourceEncoding=UTF-8

# ⛔ NE PAS METTRE :
# sonar.host.url  → injecté par Jenkins
# sonar.token     → injecté par Jenkins via credentials